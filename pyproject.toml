[project]
name = "llmops"
version = "0.1.0"
description = "LLM gateway with guardrails, cost-aware routing, and automated evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Modules live at the repo root and are imported from there; this is an app, not a library.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# ruff counts Hangul as double width, so Korean report prose trips E501 well before 100 columns.
"evals/report.py" = ["E501"]
